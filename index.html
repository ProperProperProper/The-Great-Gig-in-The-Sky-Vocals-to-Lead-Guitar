<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mirror-view electric guitar tabs and a complete 24-fret note map.">
    <title>The Great Gig in The Sky — Vocal Guitar Tab</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main>
      <header>
        <h1>The Great Gig in The Sky</h1>
        <p>Vocal solo for electric guitar · right-handed mirror view</p>
      </header>

      <section aria-labelledby="tabs-heading">
        <h2 id="tabs-heading">Full mirror-view tab</h2>
        <p class="orientation">Top to bottom: <strong>Low E · A · D · G · B · High e</strong></p>
        <pre id="full-tab" tabindex="0">Loading tab…</pre>
      </section>

      <section aria-labelledby="fretboard-heading">
        <h2 id="fretboard-heading">Every note · frets 0–24</h2>
        <p class="orientation">Standard tuning · low E at the top, high e at the bottom</p>
        <div class="fretboard-scroll" tabindex="0" aria-label="Scrollable 24-fret guitar note map">
          <div id="fretboard" class="fretboard" role="grid" aria-label="All guitar note positions"></div>
        </div>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
